apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-k8s-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-k8s-demo

  template:
    metadata:
      labels:
        app: student-k8s-demo

    spec:
      containers:
        - name: student-k8s-demo
          image: oliveprishita/student-k8s-demo:ba8f0f9cdfd6f7d64d39656eae2875e0053b3c7e
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5